<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MauriOne - كل ما تحتاجه</title>
  <meta name="description" content="تطبيق موريتاني شامل: وظائف، سيارات، عقارات، عيادات، هواتف، وخدمات منزلية" />

  <!-- Tailwind (عبر CDN — يشغّل كل تنسيقات التطبيق) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ===== إعدادات PWA ===== -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#07111F" />

  <!-- إعدادات خاصة بـ iPhone / iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MauriOne" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #000; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.jsx"></script>

  <!-- تفعيل الـ Service Worker (للتثبيت والعمل دون نت) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
